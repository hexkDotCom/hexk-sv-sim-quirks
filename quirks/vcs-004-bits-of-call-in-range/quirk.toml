id = "vcs-004"
title = "$bits of a function call in a declaration range is rejected when the function reads an outside variable"
category = "types"
kind = "runtime"
tools_affected = ["vcs"]
first_seen = { vcs = "X-2025.06" }
ieee = "1800-2017 20.6.2"
description = """
`logic [$bits(shifted(0))-1:0] wide;` where `shifted` is a module function that reads a module
variable. `$bits` of an expression of a fixed-size type is a constant and the call is not
evaluated, so the declaration is legal. VCS X-2025.06 treats the call as a constant function
call and rejects it (`Error-[INLD]`). `$bits` of the same call inside an expression is
accepted.
"""
workaround = "Take `$bits` of the return type (a typedef) instead of the call."
style_guide = []
upstream = ""
skip = []

[expected]
verilator = "ok"
questa = "ok"
vcs = "rejects"
slang = "ok"
verible = "ok"
