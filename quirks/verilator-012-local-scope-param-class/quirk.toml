id = "verilator-012"
title = "local:: in randomize() with on a specialized parameterized class is rejected"
category = "randomization"
kind = "runtime"
tools_affected = ["verilator"]
first_seen = { verilator = "5.046" }
ieee = "1800-2017 18.7.1"
description = """
`s.randomize() with {n == local::n;}` where `s` is a handle of a specialized parameterized
class (`seq #(16)`). Verilator 5.046 reports "Illegal 'local::' outside 'randomize() with'".
The same code with a class that has no parameters is accepted.
"""
workaround = "Use a name in the calling scope that cannot hit a member of the class, without `local::`."
style_guide = []
upstream = ""
skip = []

